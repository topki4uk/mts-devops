---
- name: Базовая настройка хоста
  hosts: all
  become: true            # выполнять задачи от root (через sudo)
  gather_facts: true      # собрать информацию о системе (ОС, IP, память и т.д.)

  vars:
    admin_user: deployer
    admin_ssh_key: "{{ lookup('file', '~/.ssh/id_rsa.pub') }}"

  tasks:

    - name: Создать пользователя "{{ admin_user }}" с правами sudo без пароля
      ansible.builtin.user:
        name: "{{ admin_user }}"
        comment: "Deploy user"

        groups:
          - sudo

        append: true
        shell: /bin/bash
        home: "/home/{{ admin_user }}"
        create_home: true

    - name: Добавить SSH-ключ для deploy
      ansible.posix.authorized_key:
        user: "{{ admin_user }}"
        key: "{{ admin_ssh_key }}"
        state: present

    - name: Установить зависимости (Debian/Ubuntu)
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: true
      when: ansible_os_family == "Debian"

    - name: Создать директорию для ключей
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"
      when: ansible_os_family == "Debian"

    - name: Добавить GPG-ключ Docker
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
      when: ansible_os_family == "Debian"

    - name: Добавить репозиторий Docker (Debian/Ubuntu)
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }}
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/{{ ansible_distribution | lower }}
          {{ ansible_distribution_release }} stable
        state: present
        filename: docker
      when: ansible_os_family == "Debian"

    - name: Установить Docker Engine и Compose (Debian/Ubuntu)
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true
      when: ansible_os_family == "Debian"

    - name: Запустить и включить Docker
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Добавить "{{ admin_user }}" в группу docker
      ansible.builtin.user:
        name: "{{ admin_user }}"
        groups: docker
        append: true
      register: user_mod

  handlers:
    - name: Перезапустить SSH
      ansible.builtin.service:
        name: ssh
        state: restarted